name: Release

# Publishes the package to npm when a GitHub release is published. Uses npm
# trusted publishing (OIDC), so no NPM_TOKEN secret is needed: the trusted
# publisher is configured once in the package settings on npmjs.com.
#
# The very first publish must be done manually (see the Contributing guide),
# because a trusted publisher can only be added to a package that already
# exists on npm.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # A poisoned dependency cache could inject content into the published
          # package, so the publish job builds without one.
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships an older npm.
      - run: npm install --global npm@latest # zizmor: ignore[adhoc-packages]

      # On a release, refuse to publish if the tag doesn't match the version
      # we are about to ship (tag v1.0.0 must match package.json 1.0.0).
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          pkg=$(node -p "require('./packages/starlight-pydocs/package.json').version")
          tag="${REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::Release tag '$REF_NAME' does not match package version '$pkg'."
            exit 1
          fi

      # prepack copies README/CHANGELOG/LICENSE in from the repo root, and
      # provenance is attached via the id-token permission above.
      - name: Publish
        working-directory: packages/starlight-pydocs
        run: npm publish --provenance --access public
