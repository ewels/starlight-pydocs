name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs opt in to more if needed.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint & type-check (prek)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Run the same prettier/eslint/typecheck hooks defined in prek.toml, so
      # local pre-commit and CI stay in sync. A hook that reformats or fixes a
      # file makes prek exit non-zero, failing the job.
      - run: pipx install prek
      - run: prek run --all-files --show-diff-on-failure --color always

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # uv lets the guarded runner-live tests exercise real griffe extraction;
      # without it they skip and only the checked-in dumps are covered.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # Nothing in this repository pins a Python dependency, so the cache
          # would have no key to invalidate on and uvx would keep serving an
          # old griffe to the tests that check for drift.
          enable-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter starlight-pydocs test:coverage

  docs:
    name: Build docs (link validation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # The docs build extracts the fixture package with griffe via uv.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # Nothing here pins a Python dependency, so the cache would have no
          # key to invalidate on and uvx would keep serving an old griffe.
          enable-cache: false
      - run: pnpm install --frozen-lockfile
      # starlight-links-validator runs inside this build and fails it on a broken
      # internal link or a dead heading anchor, writing a table to the job
      # summary. The end-to-end job builds the site too, but a failure there
      # surfaces as a preview server that never starts, which reads as a flake.
      - run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # The docs build extracts the fixture package with griffe via uv.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # Nothing here pins a Python dependency, so the cache would have no
          # key to invalidate on and uvx would keep serving an old griffe.
          enable-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter starlight-pydocs-docs exec playwright install --with-deps chromium
      - run: pnpm --filter starlight-pydocs-docs test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: docs/playwright-report/
          retention-days: 7

  zizmor:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Annotations mode rather than a code-scanning upload: it needs no
      # Advanced Security (which private repositories lack), and it fails the
      # job on findings instead of filing them away in the security tab.
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          persona: pedantic
          inputs: .github/workflows
          advanced-security: false
          annotations: true
